[project]
name = "quotabubble"
version = "0.1.2"
description = "A lightweight cross-platform floating widget that shows AI usage quotas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Izzet Yildirim", email = "izzet@izzet.dev" }]
keywords = [
    "ai",
    "usage",
    "quota",
    "claude-code",
    "codex",
    "copilot",
    "antigravity",
    "deepseek",
    "openrouter",
    "desktop-widget",
    "pyside6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx2>=2.12",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pyside6>=6.7",
]

[project.gui-scripts]
quotabubble = "quotabubble.app.main:main"

[project.urls]
Homepage = "https://izzet.github.io/quotabubble/"
Repository = "https://github.com/izzet/quotabubble"
Issues = "https://github.com/izzet/quotabubble/issues"
Changelog = "https://github.com/izzet/quotabubble/releases"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotabubble"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
