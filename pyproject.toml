[project]
name = "quotabubble"
version = "0.1.0"
description = "A lightweight cross-platform floating widget that shows AI usage quotas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.12",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pyside6>=6.7",
]

[project.gui-scripts]
quotabubble = "quotabubble.app.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotabubble"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
