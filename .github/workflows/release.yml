name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Matrix of per-OS binary builds. Each entry tests, builds with PyInstaller,
  # packages a platform-native artifact, and uploads it as a CI artifact.
  # None of them publish anything themselves.
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: QuotaBubble-windows-x64.zip
            spec: packaging/quotabubble.windows.spec
          - os: macos-15-intel
            artifact: QuotaBubble-macos-x64.dmg
            spec: packaging/quotabubble.macos.spec
          - os: macos-14
            artifact: QuotaBubble-macos-arm64.dmg
            spec: packaging/quotabubble.macos.spec
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Test
        run: uv run pytest -q

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: uv run python scripts/make_icon.py

      - name: Build
        run: uv run pyinstaller --noconfirm ${{ matrix.spec }}

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/QuotaBubble/* -DestinationPath ${{ matrix.artifact }}

      # These initial public builds use PyInstaller's ad hoc signatures. Add
      # Developer ID signing, notarization, and stapling here once the
      # repository has the Apple Developer credentials required to do so.
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: hdiutil create -volname QuotaBubble -srcfolder dist/QuotaBubble.app -ov -format UDZO ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Fan-in: waits for every platform in the build matrix, then creates ONE
  # GitHub Release with all of their archives attached at once. Downstream
  # per-channel jobs depend on this job, never on individual build entries,
  # so they always see a fully-published release regardless of how many
  # platforms are in the matrix.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  winget:
    needs: github-release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Skip when WINGET_TOKEN is not configured
        if: env.WINGET_TOKEN == ''
        shell: pwsh
        run: Write-Output "WINGET_TOKEN is not set; skipping winget submission."

      - name: Download komac
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $url = "https://github.com/RussellBanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile komac.exe

      - name: Submit winget update
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $zip = "https://github.com/izzet/quotabubble/releases/download/v$version/QuotaBubble-windows-x64.zip"
          .\komac.exe update Izzet.QuotaBubble -v $version -u $zip --submit --token $env:WINGET_TOKEN

  chocolatey:
    needs: github-release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when CHOCOLATEY_API_KEY is not configured
        if: env.CHOCOLATEY_API_KEY == ''
        shell: pwsh
        run: Write-Output "CHOCOLATEY_API_KEY is not set; skipping Chocolatey submission."

      - name: Pack and push
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $zipUrl = "https://github.com/izzet/quotabubble/releases/download/v$version/QuotaBubble-windows-x64.zip"

          Invoke-WebRequest -Uri $zipUrl -OutFile QuotaBubble-windows-x64.zip
          $checksum = (Get-FileHash QuotaBubble-windows-x64.zip -Algorithm SHA256).Hash

          $installScript = "packaging/chocolatey/tools/chocolateyinstall.ps1"
          (Get-Content $installScript -Raw) `
            -replace '__URL__', $zipUrl `
            -replace '__CHECKSUM__', $checksum |
            Set-Content $installScript

          choco pack packaging/chocolatey/quotabubble.nuspec --version $version --outputdirectory .
          choco push "quotabubble.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

  pypi:
    # Deliberately no `needs:` on build/github-release: the published wheel
    # is pure Python (py3-none-any, no compiled extensions), so it's
    # identical regardless of which OS built it and doesn't depend on any
    # platform-specific binary succeeding. Its own commit already went
    # through the full test suite via ci.yml before being merged to main,
    # so this job only needs to verify the *built wheel* is sound, not
    # re-run the whole suite.
    #
    # That verification deliberately isn't the full pytest suite either:
    # PySide6 needs system libraries (libGL, libglib, etc.) this runner
    # doesn't have, and installing them just to satisfy Qt imports the
    # package itself doesn't need here would be testing the wrong thing.
    # A plain import of a non-Qt module is enough to catch real packaging
    # mistakes (missing package data, broken entry points, bad metadata).
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Smoke test the built wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "from quotabubble.app.settings import Settings; Settings()"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
