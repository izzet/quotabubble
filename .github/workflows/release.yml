name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv run pyinstaller --noconfirm packaging/quotabubble.spec

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/QuotaBubble/* -DestinationPath QuotaBubble-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QuotaBubble-windows-x64.zip

  winget:
    needs: windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Skip when WINGET_TOKEN is not configured
        if: env.WINGET_TOKEN == ''
        shell: pwsh
        run: Write-Output "WINGET_TOKEN is not set; skipping winget submission."

      - name: Download komac
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $url = "https://github.com/RussellBanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile komac.exe

      - name: Submit winget update
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $zip = "https://github.com/izzet/quotabubble/releases/download/v$version/QuotaBubble-windows-x64.zip"
          .\komac.exe update Izzet.QuotaBubble -v $version -u $zip --submit --token $env:WINGET_TOKEN

  chocolatey:
    needs: windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when CHOCOLATEY_API_KEY is not configured
        if: env.CHOCOLATEY_API_KEY == ''
        shell: pwsh
        run: Write-Output "CHOCOLATEY_API_KEY is not set; skipping Chocolatey submission."

      - name: Pack and push
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $zipUrl = "https://github.com/izzet/quotabubble/releases/download/v$version/QuotaBubble-windows-x64.zip"

          Invoke-WebRequest -Uri $zipUrl -OutFile QuotaBubble-windows-x64.zip
          $checksum = (Get-FileHash QuotaBubble-windows-x64.zip -Algorithm SHA256).Hash

          $installScript = "packaging/chocolatey/tools/chocolateyinstall.ps1"
          (Get-Content $installScript -Raw) `
            -replace '__URL__', $zipUrl `
            -replace '__CHECKSUM__', $checksum |
            Set-Content $installScript

          choco pack packaging/chocolatey/quotabubble.nuspec --version $version --outputdirectory .
          choco push "quotabubble.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

